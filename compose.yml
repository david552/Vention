services:
  api:
    container_name: vention-api
    build:
      context: .
      dockerfile: Vention.API/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - CryptoSettings__PasswordPepper=${PASSWORD_PEPPER}
      - ConnectionStrings__DefaultConnection=Host=vention-postgres;Database=VentionDb;Username=postgres;Password=your_secret_password
    networks:
      - vention-network
    depends_on:
      vention-postgres:
        condition: service_healthy

  vention-postgres:
    container_name: vention-postgres
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=your_secret_password
      - POSTGRES_DB=VentionDb
    ports:
      - "5432:5432" 
    volumes:
      - postgres-data:/var/lib/postgresql/data 
    networks:
      - vention-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres-data:

networks:
  vention-network:
    driver: bridge
services:
  api:
    container_name: my-vention-api-compose
    build:
      context: .
      dockerfile: Vention.API/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - CryptoSettings__PasswordPepper=${PASSWORD_PEPPER}
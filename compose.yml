services:
  api:
    container_name: vention-api
    build:
      context: .
      dockerfile: Vention.API/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - CryptoSettings__PasswordPepper=${PASSWORD_PEPPER}
      - ConnectionStrings__PostgresConnection=Host=vention-postgres;Database=VentionDb;Username=${POSTGRES_SECRET_USER};Password=${POSTGRES_SECRET_PASSWORD}
      - ConnectionStrings__Redis=vention-redis:6379
      - RabbitMqSettings__Host=vention-rabbitmq
      - RabbitMqSettings__Username=${RABBIT_SECRET_USER}
      - RabbitMqSettings__Password=${RABBIT_SECRET_PASS}
    networks:
      - vention-network
    depends_on:
      vention-postgres:
        condition: service_healthy
      vention-redis:
        condition: service_healthy
      vention-rabbitmq:
        condition: service_healthy

  vention-postgres:
    container_name: vention-postgres
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_SECRET_USER}
      - POSTGRES_PASSWORD=${POSTGRES_SECRET_PASSWORD}
      - POSTGRES_DB=VentionDb
    ports:
      - "5432:5432" 
    volumes:
      - postgres-data:/var/lib/postgresql/data 
    networks:
      - vention-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SECRET_USER} -d VentionDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  vention-redis:
    container_name: vention-redis
    image: redis:alpine 
    ports:
      - "6379:6379" 
    volumes:
      - redis-data:/data 
    networks:
      - vention-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"] 
      interval: 5s
      timeout: 5s
      retries: 5

  vention-rabbitmq:
    container_name: vention-rabbitmq
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"  
      - "15672:15672" 
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBIT_SECRET_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBIT_SECRET_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - vention-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:

networks:
  vention-network:
    driver: bridge
  
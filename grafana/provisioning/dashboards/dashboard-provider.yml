apiVersion: 1

providers:
  - name: 'Vention Dashboards'
    orgId: 1
    folder: 'Vention Microservices'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
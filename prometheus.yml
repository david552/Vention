global:
  scrape_interval: 15s       # Scrape metrics every 15 seconds
  evaluation_interval: 15s   # Evaluate rules every 15 seconds
  external_labels:
    cluster: 'vention-local'
    environment: 'development'

scrape_configs:
  - job_name: 'vention-api-1'
    static_configs:
      - targets: ['api-1:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'vention-api-2'
    static_configs:
      - targets: ['api-2:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'vention-gateway'
    static_configs:
      - targets: ['api-gateway:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'vention-graphql'
    static_configs:
      - targets: ['graphql:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Worker Services (with PrometheusHttpListener on dedicated ports)
  - job_name: 'vention-processor-1'
    static_configs:
      - targets: ['processor-1:9464']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'vention-processor-2'
    static_configs:
      - targets: ['processor-2:9464']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']